<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>우리집 픽업 일정</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f3f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#172033}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff}
header{padding:22px 18px 14px;background:#2563eb;color:white;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:24px}.date{margin-top:6px;opacity:.9;font-size:14px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e5e9f0;position:sticky;top:82px;z-index:4}
.tab{flex:1;padding:13px 5px;border:0;background:white;font-size:14px;color:#6b7280}.tab.active{color:#2563eb;font-weight:700;border-bottom:3px solid #2563eb}
main{padding:16px}.hidden{display:none}
.card{border:1px solid #e1e6ee;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
.person{font-size:18px;font-weight:700;margin-bottom:10px}.person.boy{color:#2563eb}.person.girl{color:#db2777}
.time{font-size:28px;font-weight:800}.route{margin-top:6px;font-size:15px;color:#4b5563}.arrow{margin:0 7px;color:#9ca3af}
.empty{text-align:center;padding:45px 10px;color:#9ca3af}
.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;margin-top:8px}
.btn.secondary{background:#eef4ff;color:#2563eb}.btn.danger{background:#fff0f0;color:#dc2626}
label{display:block;font-size:13px;font-weight:700;color:#4b5563;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;font-size:16px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:10px 2px;border:1px solid #dce1e9;border-radius:9px;background:#fff}.day.on{background:#2563eb;color:white;border-color:#2563eb}
.item{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f4;padding:12px 0}.item:first-child{border-top:0}
.small{font-size:12px;color:#7b8493}.actions button{border:0;background:none;color:#2563eb;font-weight:700;margin-left:8px}
.notice{background:#fff8e6;border-radius:12px;padding:11px 12px;font-size:13px;color:#7a5a00;margin-bottom:14px}
</style>
</head>
<body>
<div class="app">
<header><h1>🚗 우리집 픽업 일정</h1><div class="date" id="today"></div></header>
<nav class="tabs">
<button class="tab active" onclick="showTab('todayTab',this)">오늘</button>
<button class="tab" onclick="showTab('weekTab',this)">주간</button>
<button class="tab" onclick="showTab('manageTab',this)">일정관리</button>
</nav>

<main>
<section id="todayTab">
<div class="notice">매주 반복되는 학원 일정을 기준으로 오늘 픽업 일정을 보여줍니다.<br>
<button class="btn secondary" style="margin-top:8px" onclick="enableAlarm()">🔔 30분 전 알림 켜기</button>
<span id="alarmStatus" class="small" style="display:block;margin-top:7px"></span></div>
<div id="todayList"></div>
</section>

<section id="weekTab" class="hidden">
<div id="weekList"></div>
</section>

<section id="manageTab" class="hidden">
<div class="card">
<div class="person">➕ 일정 추가</div>
<label>자녀</label>
<select id="person"><option value="boy">👦 아들</option><option value="girl">👧 딸</option></select>
<label>요일</label>
<div class="days" id="days"></div>
<div class="row">
<div><label>출발시간</label><input type="time" id="time"></div>
<div><label>학원/일정명</label><input id="memo" placeholder="예: 수학"></div>
</div>
<label>출발지</label><input id="from" placeholder="예: ○○수학학원">
<label>목적지</label><input id="to" placeholder="예: 집">
<label style="display:flex;align-items:center;gap:8px;font-weight:600">
<input type="checkbox" id="alarm" checked style="width:20px;height:20px"> 이 일정 30분 전 알림
</label>
<button class="btn" onclick="addSchedule()">일정 저장</button>
</div>

<div class="card">
<div class="person">📋 등록된 반복 일정</div>
<div id="allList"></div>
</div>
</section>
</main>
</div>

<script>
const dayNames=["일","월","화","수","목","금","토"];
let schedules=JSON.parse(localStorage.getItem("pickupSchedules")||"[]");
let selectedDays=new Set();

document.getElementById("today").textContent=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
const daysEl=document.getElementById("days");
dayNames.forEach((d,i)=>{let b=document.createElement("button");b.className="day";b.textContent=d;b.onclick=()=>{if(selectedDays.has(i)){selectedDays.delete(i);b.classList.remove("on")}else{selectedDays.add(i);b.classList.add("on")}};daysEl.appendChild(b)});

function save(){localStorage.setItem("pickupSchedules",JSON.stringify(schedules));render()}
function showTab(id,el){document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");render()}
function addSchedule(){
 const person=document.getElementById("person").value,time=document.getElementById("time").value,memo=document.getElementById("memo").value.trim(),from=document.getElementById("from").value.trim(),to=document.getElementById("to").value.trim(),alarm=document.getElementById("alarm").checked;
 if(!selectedDays.size||!time||!from||!to){alert("요일, 출발시간, 출발지, 목적지를 입력해주세요.");return}
 [...selectedDays].forEach(day=>schedules.push({id:Date.now()+Math.random(),person,day,time,memo,from,to,alarm}));
 selectedDays.clear();document.querySelectorAll(".day").forEach(x=>x.classList.remove("on"));
 document.getElementById("memo").value="";document.getElementById("from").value="";document.getElementById("to").value="";
 save();alert("일정을 저장했습니다.");
}
function editSchedule(id){
 const s=schedules.find(x=>x.id==id); if(!s)return;
 document.getElementById("person").value=s.person;
 document.getElementById("time").value=s.time;
 document.getElementById("memo").value=s.memo||"";
 document.getElementById("from").value=s.from;
 document.getElementById("to").value=s.to;
 document.getElementById("alarm").checked=s.alarm!==false;
 selectedDays=new Set([s.day]);
 document.querySelectorAll(".day").forEach((b,i)=>b.classList.toggle("on",i===s.day));
 schedules=schedules.filter(x=>x.id!=id);
 localStorage.setItem("pickupSchedules",JSON.stringify(schedules));
 document.querySelectorAll(".tab")[2].click();
 window.scrollTo({top:0,behavior:"smooth"});
}
function remove(id){if(confirm("이 일정을 삭제할까요?")){schedules=schedules.filter(x=>x.id!=id);save()}}
function card(s){return `<div class="card"><div class="person ${s.person}">${s.person==="boy"?"👦 아들":"👧 딸"}${s.memo?` · ${esc(s.memo)}`:""}</div><div class="time">${s.time}</div><div class="route">${esc(s.from)} <span class="arrow">→</span> ${esc(s.to)}</div></div>`}
function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 const now=new Date(),d=now.getDay();
 let today=schedules.filter(x=>x.day===d).sort((a,b)=>a.time.localeCompare(b.time));
 document.getElementById("todayList").innerHTML=today.length?today.map(card).join(""):`<div class="empty">오늘 픽업 일정이 없습니다. 😊</div>`;
 let w="";for(let i=1;i<=7;i++){let day=i%7, arr=schedules.filter(x=>x.day===day).sort((a,b)=>a.time.localeCompare(b.time));w+=`<div class="card"><div class="person">${dayNames[day]}요일</div>${arr.length?arr.map(card).join(""):`<div class="small">일정 없음</div>`}</div>`}document.getElementById("weekList").innerHTML=w;
 let a=schedules.slice().sort((x,y)=>x.day-y.day||x.time.localeCompare(y.time));
 document.getElementById("allList").innerHTML=a.length?a.map(s=>`<div class="item"><div><b>${s.person==="boy"?"👦 아들":"👧 딸"} · ${dayNames[s.day]} ${s.time}</b><br><span class="small">${esc(s.from)} → ${esc(s.to)}${s.memo?" · "+esc(s.memo):""}${s.alarm!==false?" · 🔔30분 전":""}</span></div><div class="actions"><button onclick="editSchedule(${s.id})">수정</button><button onclick="remove(${s.id})">삭제</button></div></div>`).join(""):`<div class="empty">등록된 일정이 없습니다.</div>`;
}

let alarmPermission = Notification.permission;

function updateAlarmStatus(){
 const el=document.getElementById("alarmStatus");
 if(!el)return;
 if(!("Notification" in window)) el.textContent="이 브라우저는 알림 기능을 지원하지 않습니다.";
 else if(Notification.permission==="granted") el.textContent="알림이 켜져 있습니다. (페이지가 열려 있는 동안 알림을 확인합니다.)";
 else if(Notification.permission==="denied") el.textContent="알림이 차단되어 있습니다. 브라우저 설정에서 허용해주세요.";
 else el.textContent="버튼을 눌러 휴대폰 알림을 허용해주세요.";
}
async function enableAlarm(){
 if(!("Notification" in window)){alert("현재 브라우저에서는 알림을 지원하지 않습니다.");return}
 const result=await Notification.requestPermission();
 alarmPermission=result;
 updateAlarmStatus();
 if(result==="granted"){
   new Notification("픽업 일정 알림", {body:"30분 전 알림이 활성화되었습니다."});
 }
}
function checkAlarms(){
 if(!("Notification" in window) || Notification.permission!=="granted")return;
 const now=new Date(), day=now.getDay();
 const hhmm=now.getHours()*60+now.getMinutes();
 schedules.filter(s=>s.day===day && s.alarm!==false).forEach(s=>{
   const [h,m]=s.time.split(":").map(Number), target=h*60+m;
   let diff=target-hhmm;
   if(diff<0) diff+=1440;
   if(diff===30){
     const key=`alarm_${now.getFullYear()}_${now.getMonth()}_${now.getDate()}_${s.id}`;
     if(!sessionStorage.getItem(key)){
       sessionStorage.setItem(key,"1");
       new Notification(`${s.person==="boy"?"👦 아들":"👧 딸"} 픽업 30분 전`,{
         body:`${s.time} · ${s.from} → ${s.to}${s.memo?" · "+s.memo:""}`,
         tag:String(s.id)
       });
     }
   }
 });
}
updateAlarmStatus();
setInterval(checkAlarms,30000);
checkAlarms();
render();
</script>
</body>
</html>
