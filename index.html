<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 픽업 일정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#f4f6f8;color:#222}
.wrap{max-width:900px;margin:auto;padding:12px} header{background:#1f4e79;color:#fff;padding:18px;border-radius:14px}
h1{margin:0 0 6px;font-size:23px}.status{margin-top:10px;background:#fff;color:#333;padding:8px;border-radius:8px;font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0}.tab{flex:1;padding:12px;border:0;border-radius:9px;font-weight:bold}.active{background:#1f4e79;color:#fff}
.panel{display:none}.panel.show{display:block}.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:bold}input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #ccd3da;border-radius:8px;box-sizing:border-box}
.full{grid-column:1/-1}.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;margin-right:5px}.primary{background:#1f4e79;color:#fff}.danger{background:#fce4e4;color:#b42318}.gray{background:#e9edf1}
.item{border:1px solid #e1e5e8;border-radius:10px;padding:12px;margin:8px 0}.time{font-size:19px;font-weight:bold}.person{background:#e8f1fb;color:#1f4e79;padding:4px 8px;border-radius:15px;font-size:12px}.small{font-size:12px;color:#777}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🚗 우리집 픽업 일정</h1><div>PC와 휴대폰에서 같은 일정을 사용합니다.</div><div id="status" class="status">연결 준비 중...</div></header>

<div class="tabs">
<button class="tab active" data-p="today">오늘</button>
<button class="tab" data-p="week">주간 일정</button>
<button class="tab" data-p="manage">일정 관리</button>
</div>

<section id="today" class="panel show"><div class="card"><h2 id="todayTitle">오늘 일정</h2><div id="todayList"></div></div></section>
<section id="week" class="panel"><div class="card"><h2>이번 주 일정</h2><div id="weekList"></div></div></section>

<section id="manage" class="panel">
<div class="card">
<h2 id="formTitle">일정 추가</h2><input type="hidden" id="editId">
<div class="grid">
<div><label>자녀</label><select id="person"><option>아들</option><option>딸</option></select></div>
<div><label>요일</label><select id="day"><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option></select></div>
<div><label>출발 시간</label><input type="time" id="time" value="18:00"></div>
<div><label>출발 장소</label><input id="from" placeholder="예: 학교"></div>
<div><label>목적지</label><input id="to" placeholder="예: 집"></div>
<div><label>메모</label><input id="memo" placeholder="예: 정문"></div>
<div class="full"><label><input type="checkbox" id="alarm" checked style="width:auto"> 30분 전 알림 사용</label></div>
<div class="full"><button class="btn primary" id="save">일정 저장</button><button class="btn gray" id="cancel" style="display:none">취소</button></div>
</div></div></div>

<div class="card"><h2>등록된 일정</h2><div id="manageList"></div></div>
<div class="card"><label><input type="checkbox" id="globalAlarm" checked style="width:auto"> 전체 알림 사용</label><p class="small">※ 브라우저가 완전히 종료되거나 절전 상태이면 웹 알림이 동작하지 않을 수 있습니다.</p></div>
</section>
</div>

<script>
const SUPABASE_URL="https://vbsgpctfkyhqmbqxaugl.supabase.co/rest/v1/";
const SUPABASE_KEY="sb_publishable_Fk596kGjIvUEOrqVb929Rw_CWDW7f-1";
let client=null,schedules=[],globalAlarm=true;
const statusEl=document.getElementById("status");
const names={0:"일",1:"월",2:"화",3:"수",4:"목",5:"금",6:"토"};
const $=id=>document.getElementById(id);
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function setStatus(t,ok=false){statusEl.textContent=t;statusEl.style.color=ok?"#176b3a":"#333"}
function item(s,buttons=false){
return `<div class="item"><span class="person">${esc(s.person)}</span> <span class="time">${esc(s.time)}</span> <b>${names[s.day]}요일</b><br>
${esc(s.from_location)} → <b>${esc(s.to_location)}</b>${s.memo?`<div class="small">메모: ${esc(s.memo)}</div>`:""}
<div class="small">${s.alarm?"🔔 알림 ON":"🔕 알림 OFF"}</div>
${buttons?`<button class="btn gray" onclick="editSchedule('${s.id}')">수정</button><button class="btn danger" onclick="deleteSchedule('${s.id}')">삭제</button>`:""}</div>`}
function render(){
const now=new Date(),d=now.getDay();
$("todayTitle").textContent=`오늘 일정 · ${now.getMonth()+1}/${now.getDate()} (${names[d]})`;
let a=schedules.filter(s=>+s.day===d).sort((x,y)=>x.time.localeCompare(y.time));
$("todayList").innerHTML=a.length?a.map(s=>item(s)).join(""):"<p class='small'>오늘 일정이 없습니다.</p>";
let w="";[1,2,3,4,5,6,0].forEach(day=>{let x=schedules.filter(s=>+s.day===day).sort((a,b)=>a.time.localeCompare(b.time));w+=`<h3>${names[day]}요일</h3>${x.length?x.map(s=>item(s)).join(""):"<div class='small'>일정 없음</div>"}`});$("weekList").innerHTML=w;
let m=[...schedules].sort((a,b)=>((+a.day||7)-(+b.day||7))||a.time.localeCompare(b.time));$("manageList").innerHTML=m.length?m.map(s=>item(s,true)).join(""):"<p class='small'>등록된 일정이 없습니다.</p>";
}
async function load(){
if(!client)return;
const r=await client.from("pickup_schedules").select("*").order("day").order("time");
if(r.error){setStatus("조회 오류: "+r.error.message);return}
schedules=r.data||[];render();
}
async function saveSchedule(){
if(!client){alert("먼저 Supabase URL과 Publishable key를 입력하세요.");return}
const p={person:$("person").value,day:+$("day").value,time:$("time").value,from_location:$("from").value.trim(),to_location:$("to").value.trim(),memo:$("memo").value.trim(),alarm:$("alarm").checked};
if(!p.time||!p.from_location||!p.to_location){alert("출발 시간, 출발 장소, 목적지를 입력하세요.");return}
let r=$("editId").value?await client.from("pickup_schedules").update(p).eq("id",$("editId").value):await client.from("pickup_schedules").insert(p);
if(r.error){alert("저장 실패\n"+r.error.message);return}
resetForm();await load();
}
function editSchedule(id){let s=schedules.find(x=>String(x.id)===String(id));if(!s)return;
$("editId").value=s.id;$("person").value=s.person;$("day").value=s.day;$("time").value=s.time;$("from").value=s.from_location||"";$("to").value=s.to_location||"";$("memo").value=s.memo||"";$("alarm").checked=s.alarm!==false;$("formTitle").textContent="일정 수정";$("save").textContent="수정 저장";$("cancel").style.display="inline-block";}
async function deleteSchedule(id){if(!confirm("이 일정을 삭제하시겠습니까?"))return;let r=await client.from("pickup_schedules").delete().eq("id",id);if(r.error){alert("삭제 실패\n"+r.error.message);return}load()}
function resetForm(){$("editId").value="";$("time").value="18:00";$("from").value="";$("to").value="";$("memo").value="";$("alarm").checked=true;$("formTitle").textContent="일정 추가";$("save").textContent="일정 저장";$("cancel").style.display="none"}
async function notifyPermission(){if("Notification" in window){let p=await Notification.requestPermission();if(p!=="granted")alert("브라우저에서 알림을 허용해주세요.")}}
function checkAlarm(){if(!globalAlarm||!("Notification"in window)||Notification.permission!=="granted")return;let n=new Date(),d=n.getDay(),min=n.getHours()*60+n.getMinutes();schedules.forEach(s=>{if(!s.alarm||+s.day!==d)return;let q=s.time.split(":").map(Number),target=q[0]*60+q[1];if(target-min===30){let k=`pickupAlarm-${s.id}-${n.toDateString()}`;if(!localStorage.getItem(k)){new Notification("픽업 30분 전 알림",{body:`${s.person}: ${s.from_location} → ${s.to_location}`});localStorage.setItem(k,"1")}}})}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"));b.classList.add("active");$(b.dataset.p).classList.add("show")});
$("save").onclick=saveSchedule;$("cancel").onclick=resetForm;$("alarm").onchange=e=>{if(e.target.checked)notifyPermission()};$("globalAlarm").onchange=e=>{globalAlarm=e.target.checked;if(globalAlarm)notifyPermission()};
if(!SUPABASE_URL.includes("여기에_")&&!SUPABASE_KEY.includes("여기에_")){client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);setStatus("Supabase 연결 확인 중...");load()}else setStatus("index.html의 두 곳에 Supabase 정보를 입력하세요.");
setInterval(checkAlarm,30000);
</script>
</body>
</html>
